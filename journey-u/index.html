<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#071b2d">
  <title>Journey-U | Journey Community Church</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top right, #155258, transparent 65%), #071b2d;
      color: #f7f4ed;
      font: 1rem/1.6 Inter, system-ui, sans-serif;
    }
    .wrap { width: min(100% - 2.5rem, 66rem); margin-inline: auto; }
    header { padding-block: 1.5rem; border-bottom: 1px solid #ffffff30; }
    header a { color: inherit; font-weight: 750; text-decoration: none; }
    main { padding-block: clamp(4rem, 14vw, 10rem); }
    h1 { margin: 0; font-size: clamp(3.5rem, 11vw, 8rem); line-height: 1; letter-spacing: -.06em; }
    .lead { max-width: 35rem; color: #e1eeeb; font-size: clamp(1.125rem, 3vw, 1.4rem); }
    .button {
      display: inline-flex;
      align-items: center;
      min-height: 3rem;
      padding: .65rem 1.35rem;
      border-radius: 999px;
      background: #62e3cc;
      color: #071b2d;
      font-weight: 800;
      text-decoration: none;
    }
    .button:hover { background: #a3f6e7; }
    a:focus-visible { outline: 3px solid #fff; outline-offset: 5px; }
    .hint { color: #c7dbd9; margin-top: 1rem; }
  </style>
</head>
<body>
  <header><div class="wrap"><a href="/">Journey Community Church</a></div></header>
  <main class="wrap">
    <h1>Journey-U</h1>
    <p class="lead">Open Scripture, work through the hard questions, and take what you learn to the table.</p>
    <a class="button" href="https://journey-u.jcouch05.chatgpt.site/">Enter Journey-U</a>
    <p class="hint">Study access is by invitation. Sign in with the account that received your invitation.</p>
  </main>
</body>
</html>
